<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Us — NAVA × 404 SG</title><style>html,body{margin:0;background:#0a0a0a;color:#666;font:13px/1.6 sans-serif}#p{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;letter-spacing:.3em}</style></head><body><div id="p">LOADING</div><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>
(function(){
function fail(m){document.getElementById('p').textContent=m}
function get(u){return fetch(u).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
Promise.all([get('data/find-us.txt'),get('data/find-us.p1'),get('data/find-us.p2')]).then(function(rs){
var t=rs[0],lines=null,i,p,k;
for(i=1;i<3;i++){if(rs[i]){if(!lines)lines=t.split('\n');p=JSON.parse(rs[i]);for(k in p)lines[(+k)-1]=p[k];}}
if(lines)t=lines.join('\n');
if(typeof pako==='undefined')throw new Error('decoder unavailable');
var bin=atob(t.replace(/\s/g,'')),bytes=new Uint8Array(bin.length);
for(i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
var html=pako.ungzip(bytes,{to:'string'});
document.open();document.write(html);document.close();
}).catch(function(e){fail('PREVIEW FAILED TO LOAD — PLEASE REFRESH');console.error(e)});
})();
</script></body></html>
